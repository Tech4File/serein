services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: serein
      POSTGRES_USER: serein
      POSTGRES_PASSWORD: dev-only-change-me
    ports: ["5432:5432"]
    volumes: ["serein_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serein -d serein"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  serein_pg:

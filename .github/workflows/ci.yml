name: Checks and mobile builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/sync-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cross-check VERSION, Cargo manifests, Android/iOS settings, and pushed release tag
        run: python3 scripts/check_versions.py
      - name: Validate repository automation scripts
        run: |
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          bash -n scripts/build_native_core.sh scripts/test_core_ffi.sh

  web:
    needs: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sync-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build shared Rust/WASM core and generated design tokens
        run: |
          python3 scripts/generate-design-tokens.py --check
          cargo build --manifest-path crates/serein-core/Cargo.toml --release --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/serein_core.wasm frontend/web/serein_core.wasm
      - name: Check browser scripts
        run: |
          node --check frontend/web/app.js
          node --check frontend/web/config.js
          node --check frontend/web/core-bridge.js
          node --check frontend/web/device-crypto.js
          node --check frontend/web/message-limits.js
          node --check frontend/web/security.js
          node --check frontend/web/status.js
          node --test frontend/web/tests/*.test.cjs
          node --check frontend/web/components/serein-ui.js
      - name: Upload static web client
        uses: actions/upload-artifact@v4
        with:
          name: serein-web-static
          path: frontend/web/
          if-no-files-found: error

  rust:
    needs: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sync-version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --manifest-path backend/Cargo.toml
      - run: cargo test --manifest-path backend/Cargo.toml
      - run: cargo test --manifest-path Cargo.toml -p serein-core
      - name: Link and exercise the shared core C ABI
        run: bash scripts/test_core_ffi.sh
      - run: cargo test --manifest-path Cargo.toml -p serein-moq-engine
      # The manual auth smoke test needs two real inboxes and live mail-provider credentials.
      # Keep it out of CI so test messages and secrets are never sent to a fake endpoint.

  mobile-core:
    needs: version-consistency
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: macos-15
            target: aarch64-apple-ios
          - os: macos-15
            target: aarch64-apple-ios-sim
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sync-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross-check the shared Rust core target
        run: cargo check --manifest-path crates/serein-core/Cargo.toml --target ${{ matrix.target }}

  android:
    needs: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sync-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          # The upstream v3 default includes the retired `tools` package.
          # Command-line tools are installed by the action; install only adb here.
          packages: platform-tools
      - name: Install Android SDK, NDK and CMake
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build native Rust crypto core for Android ABIs
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash scripts/build_native_core.sh android
      - name: Build APKs
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: serein-android-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  android-instrumented:
    needs: version-consistency
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sync-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android compile SDK, NDK and CMake
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Run native backup/storage tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            bash -euo pipefail -c 'cd apps/android && gradle --no-daemon :app:connectedDebugAndroidTest --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/android-instrumented-${API_LEVEL}.log"'
        env:
          API_LEVEL: ${{ matrix.api-level }}
      - name: Upload Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serein-android-test-api-${{ matrix.api-level }}-${{ github.sha }}
          path: |
            android-instrumented-*.log
            apps/android/app/build/outputs/androidTest-results/connected/**
            apps/android/app/build/reports/androidTests/connected/**
          if-no-files-found: ignore

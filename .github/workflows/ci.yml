name: Checks and mobile builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cross-check VERSION, Cargo manifests, Android/iOS settings, and pushed release tag
        run: python3 scripts/check_versions.py

  web:
    needs: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build shared Rust/WASM core and generated design tokens
        run: |
          python3 scripts/generate-design-tokens.py --check
          cargo build --manifest-path crates/serein-core/Cargo.toml --release --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/serein_core.wasm frontend/web/serein_core.wasm
      - name: Check browser scripts
        run: |
          node --check frontend/web/app.js
          node --check frontend/web/config.js
          node --check frontend/web/core-bridge.js
          node --check frontend/web/device-crypto.js
          node --check frontend/web/message-limits.js
          node --check frontend/web/security.js
          node --check frontend/web/status.js
          node --test frontend/web/tests/*.test.cjs
          node --check frontend/web/components/serein-ui.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('media-transport-spike/web/index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>', html, re.S)
          Path('/tmp/wt-inline-check.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/wt-inline-check.js
      - name: Upload static web client
        uses: actions/upload-artifact@v4
        with:
          name: serein-web-static
          path: frontend/web/
          if-no-files-found: error

  rust:
    needs: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --manifest-path backend/Cargo.toml
      - run: cargo test --manifest-path backend/Cargo.toml
      - run: cargo test --manifest-path Cargo.toml -p serein-core
      - run: cargo test --manifest-path Cargo.toml -p serein-moq-engine
      - run: cargo check --manifest-path media-transport-spike/Cargo.toml
      # The manual auth smoke test needs two real inboxes and live mail-provider credentials.
      # Keep it out of CI so test messages and secrets are never sent to a fake endpoint.

  mobile-core:
    needs: version-consistency
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: macos-15
            target: aarch64-apple-ios
          - os: macos-15
            target: aarch64-apple-ios-sim
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross-check the shared Rust core target
        run: cargo check --manifest-path crates/serein-core/Cargo.toml --target ${{ matrix.target }}

  android:
    needs: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          # The upstream v3 default includes the retired `tools` package.
          # Command-line tools are installed by the action; install only adb here.
          packages: platform-tools
      - name: Install Android SDK targets
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build APKs
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: serein-android-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  android-instrumented:
    needs: version-consistency
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Run native backup/storage tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          script: cd apps/android && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serein-android-test-api-${{ matrix.api-level }}-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/androidTest-results/connected/**
            apps/android/app/build/reports/androidTests/connected/**
          if-no-files-found: ignore

  ios-simulator:
    needs: version-consistency
    # The Xcode 16.4 x64 runner has repeatedly segfaulted inside xcodebuild before
    # Swift compilation. Use the Apple-silicon macOS 15 runner and capture native
    # diagnostics; do not treat a launcher crash as a successful simulator build.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Xcode and report runner architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test -d /Applications/Xcode_16.4.app/Contents/Developer
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          uname -a
          xcodebuild -version
          xcodebuild -showsdks
      - name: Preflight Xcode project resolution
        run: |
          set -euo pipefail
          xcodebuild -list -project apps/ios/SereinChat.xcodeproj 2>&1 | tee "$RUNNER_TEMP/xcode-list.log"
      - name: Build iOS simulator app
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -project apps/ios/SereinChat.xcodeproj \
            -scheme SereinChat \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -jobs 1 \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION="$(cut -d- -f1 VERSION)" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then exit "$build_status"; fi
          cd "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent SereinChat.app "$GITHUB_WORKSPACE/SereinChat-iOS-Simulator.zip"
      - name: Launch the built app in an available iOS simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          for runtime, entries in devices.items():
              if runtime.startswith('com.apple.CoreSimulator.SimRuntime.iOS'):
                  for device in entries:
                      if device.get('name','').startswith('iPhone'):
                          print(device['udid']); raise SystemExit(0)
          raise SystemExit('No available iOS simulator device found')
          PY
          )"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/SereinChat.app"
          test -d "$APP"
          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" io.serein.chat
          xcrun simctl shutdown "$DEVICE_ID"
      - name: Collect iOS compiler crash diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/ios-diagnostics"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \( -iname 'xcodebuild*' -o -iname 'swift-frontend*' -o -iname 'swift*' \) -mtime -1 -exec cp {} "$RUNNER_TEMP/ios-diagnostics/" \; 2>/dev/null || true
          cp "$RUNNER_TEMP/xcodebuild.log" "$RUNNER_TEMP/ios-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP/xcode-list.log" "$RUNNER_TEMP/ios-diagnostics/" 2>/dev/null || true
      - name: Upload iOS crash diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serein-ios-build-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/ios-diagnostics/
          if-no-files-found: ignore
      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: serein-ios-simulator-${{ github.sha }}
          path: SereinChat-iOS-Simulator.zip
          if-no-files-found: error

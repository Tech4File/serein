name: Rust dependency security audit
on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - backend/Cargo.toml
      - .github/workflows/security-audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - backend/Cargo.toml
      - .github/workflows/security-audit.yml
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned RustSec cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the committed dependency lockfile
        run: cargo audit --file Cargo.lock

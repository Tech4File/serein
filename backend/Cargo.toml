[package]
name = "serein-api"
version.workspace = true
edition = "2021"
rust-version = "1.94"

[dependencies]
serein-core = { path = "../crates/serein-core" }
argon2 = "0.5"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
dashmap = "6"
futures-util = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# PostgreSQL only: keep default SQLx features off so unused drivers stay disabled.
# MySQL RSA authentication is intentionally not enabled.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Email-only transports: SMTP/TLS and HTTPS API. Use Rustls/AWS-LC rather than
# native-tls/OpenSSL; pins are reviewed manually before upgrading.
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }

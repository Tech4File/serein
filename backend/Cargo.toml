[package]
name = "serein-api"
version = "0.4.0-dev.16"
edition = "2021"
rust-version = "1.85"

[dependencies]
serein-core = { path = "../crates/serein-core" }
argon2 = "0.5"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
dashmap = "6"
futures-util = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Email-only transports: SMTP/TLS and HTTPS API. Versions are intentionally exact;
# dependency updates are manual and must be reviewed before upgrading.
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-native-tls"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }

plugins { id 'com.android.application' }

android {
    namespace 'io.serein.chat'
    compileSdk 35
    useLibrary 'android.test.base'
    def repoVersion = file('../../../VERSION').text.trim()
    def buildNumber = System.getenv('ANDROID_VERSION_CODE') ?: '17'
    defaultConfig {
        applicationId 'io.serein.chat'
        minSdk 26
        targetSdk 35
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64' }
        externalNativeBuild {
            cmake {
                arguments "-DSEREIN_REPOSITORY_ROOT=${rootProject.projectDir.parentFile.parentFile.absolutePath}"
            }
        }
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        versionCode buildNumber.toInteger()
        versionName repoVersion
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
}

dependencies { }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def buildSereinCoreAndroid = tasks.register('buildSereinCoreAndroid', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', '../../scripts/build_native_core.sh', 'android'
}
tasks.configureEach {
    if (name.startsWith('configureCMake') || name.startsWith('buildCMake')) {
        dependsOn buildSereinCoreAndroid
    }
}

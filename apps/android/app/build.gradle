plugins { id 'com.android.application' }

android {
    namespace 'io.serein.chat'
    compileSdk 35
    def repoVersion = file('../../../VERSION').text.trim()
    def buildNumber = System.getenv('ANDROID_VERSION_CODE') ?: '6'
    defaultConfig {
        applicationId 'io.serein.chat'
        minSdk 26
        targetSdk 35
        versionCode buildNumber.toInteger()
        versionName repoVersion
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
}

dependencies { }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
